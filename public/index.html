<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경비 정산</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: sans-serif; font-size: 15px; color: #222; background: #fff; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 12px 16px 24px; }
  h1 { font-size: 20px; margin: 4px 0 10px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid #999; }
  .tabs button { flex: 0 0 auto; padding: 10px 18px; font-size: 15px; border: 1px solid #999; border-bottom: none; background: #eee; cursor: pointer; }
  .tabs button.on { background: #fff; font-weight: bold; position: relative; top: 1px; }
  section { padding: 14px 0; }
  .hidden { display: none !important; }
  .msg { min-height: 1.4em; margin: 6px 0 10px; }
  .msg.err { color: #c00; }
  .msg.ok { color: #060; }

  /* 등록 칸: 넓으면 이름표 옆에 칸, 좁으면 이름표 아래에 칸 (F-11) */
  .row { display: grid; grid-template-columns: 90px 1fr; gap: 8px; align-items: center; margin-bottom: 10px; }
  .row label { font-weight: bold; }
  .row input, .row select { width: 100%; padding: 8px; font-size: 15px; border: 1px solid #999; }
  .row input.short { max-width: 120px; }
  .hint { color: #666; font-size: 13px; }
  .btn { padding: 10px 28px; font-size: 16px; border: 1px solid #555; background: #f4f4f4; cursor: pointer; }
  .btn:disabled, select:disabled, input:disabled { opacity: .5; cursor: not-allowed; }
  .center { text-align: center; margin-top: 8px; }

  .filters { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .filters label { display: flex; gap: 6px; align-items: center; }
  .filters select { padding: 6px; font-size: 15px; }

  .tablebox { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border-bottom: 1px solid #ccc; padding: 7px 6px; text-align: left; white-space: nowrap; }
  th { background: #f2f2f2; }
  td.num, th.num { text-align: right; }
  tbody.click tr { cursor: pointer; }
  tbody.click tr:hover { background: #f7f7f7; }
  tfoot td { font-weight: bold; border-bottom: none; }

  .big { font-size: 17px; margin: 4px 0; }
  .sum h3 { font-size: 16px; margin: 18px 0 6px; }

  /* 상세 창 (S-04) */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; justify-content: center; align-items: flex-start; padding: 24px 12px; overflow-y: auto; }
  .panel { background: #fff; width: 100%; max-width: 520px; border: 1px solid #777; padding: 14px 16px; }
  .panel .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .panel .head b { font-size: 17px; }
  .photo { background: #ccc; min-height: 200px; display: flex; align-items: center; justify-content: center; color: #555; margin-bottom: 10px; text-align: center; padding: 8px; }
  .photo img { max-width: 100%; display: block; }
  dl { display: grid; grid-template-columns: 80px 1fr; gap: 4px 8px; margin: 0 0 10px; }
  dt { color: #555; }
  dd { margin: 0; word-break: break-all; }

  footer { border-top: 1px solid #ccc; margin-top: 16px; padding-top: 8px; font-size: 12px; color: #777; text-align: right; }

  @media (max-width: 600px) {
    .row { grid-template-columns: 1fr; gap: 4px; }
    .row input.short { max-width: none; }
    .btn { width: 100%; }
    .filters { flex-direction: column; gap: 6px; }
    .filters label { justify-content: space-between; }
    .filters select { flex: 1; margin-left: 8px; }
    .tabs button { flex: 1; padding: 12px 0; }
    .overlay { padding: 0; }
    .panel { max-width: none; min-height: 100%; border: none; }
  }
</style>
<!-- F-01 설정: 주소와 공개용 키는 config.js에서만 읽는다 -->
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
</head>
<body>
<div class="wrap">
  <h1>경비 정산</h1>
  <div class="tabs">
    <button data-tab="reg" class="on">등록</button>
    <button data-tab="list">목록</button>
    <button data-tab="sum">집계</button>
  </div>

  <!-- S-01 등록 -->
  <section id="tab-reg">
    <div class="msg" id="reg-msg"></div>
    <form id="reg-form" onsubmit="return false">
      <div class="row"><label for="f-emp">제출자</label>
        <select id="f-emp"><option value="">직원 고르기</option></select></div>
      <div class="row"><label for="f-photo">사진</label>
        <input id="f-photo" type="file" accept="image/jpeg,image/png,image/webp"></div>
      <div class="row"><label for="f-kind">구분</label>
        <select id="f-kind"><option value="">고르기</option><option>식사</option><option>카페</option><option>택시</option></select></div>
      <div class="row"><label for="f-date">날짜</label>
        <input id="f-date" type="date"></div>
      <div class="row"><label for="f-time">시각</label>
        <div><input id="f-time" class="short" type="text" inputmode="numeric" placeholder="12:20" maxlength="5"> <span class="hint">24시간 형식</span></div></div>
      <div class="row"><label for="f-store">가게 이름</label>
        <input id="f-store" type="text" maxlength="100"></div>
      <div class="row"><label for="f-total">합계(원)</label>
        <input id="f-total" type="text" inputmode="numeric"></div>
      <div class="row" id="r-purpose"><label for="f-purpose">목적</label>
        <select id="f-purpose"><option value="">고르기</option><option>일반</option><option>회식</option><option>접대</option></select></div>
      <div class="row" id="r-people"><label for="f-people">인원</label>
        <input id="f-people" class="short" type="text" inputmode="numeric"></div>
      <div class="row hidden" id="r-guest"><label for="f-guest">접대 상대</label>
        <input id="f-guest" type="text" maxlength="100"></div>
      <div class="row"><label for="f-memo">메모</label>
        <input id="f-memo" type="text" maxlength="200"></div>
      <div class="center"><button class="btn" id="reg-btn" type="button" disabled>등록</button></div>
    </form>
  </section>

  <!-- S-02 목록 -->
  <section id="tab-list" class="hidden">
    <!-- F-12 목록 요약 줄 (v1.1) -->
    <p class="big hidden" id="list-summary"></p>
    <div class="filters">
      <label>월 <select id="l-month"></select></label>
      <label>제출자 <select id="l-emp"><option value="">전체</option></select></label>
      <label>구분 <select id="l-kind"><option value="">전체</option><option>식사</option><option>카페</option><option>택시</option></select></label>
    </div>
    <div class="msg" id="list-msg"></div>
    <div class="tablebox hidden" id="list-box">
      <table>
        <thead><tr><th>일시</th><th>제출자</th><th>구분</th><th>가게</th><th class="num">합계</th><th>등록</th></tr></thead>
        <tbody class="click" id="list-body"></tbody>
      </table>
    </div>
  </section>

  <!-- S-03 집계 -->
  <section id="tab-sum" class="hidden">
    <div class="filters">
      <label>월 <select id="s-month"></select></label>
    </div>
    <div class="msg" id="sum-msg"></div>
    <div class="sum" id="sum-box"></div>
  </section>

  <!-- F-10 버전 표시 -->
  <footer id="version">v1.1</footer>
</div>

<!-- S-04 상세 -->
<div class="overlay hidden" id="detail">
  <div class="panel">
    <div class="head"><b>영수증 상세</b><button class="btn" id="d-close" style="padding:6px 14px;width:auto">닫기</button></div>
    <div class="msg" id="d-msg"></div>
    <div id="d-body"></div>
  </div>
</div>

<script>
const BUCKET = "receipts";          // 04 데이터정의서: 비공개 사진 저장소
const SIGNED_URL_SECONDS = 600;     // 사진 임시 주소 10분
const MAX_PHOTO_BYTES = 10 * 1024 * 1024;
const PHOTO_TYPES = { "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp" };
const NO_DATE = "일시 없음";

const $ = (id) => document.getElementById(id);
const won = (n) => Number(n || 0).toLocaleString("ko-KR");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dash = (x) => (x == null || x === "" ? "-" : esc(x));

let db = null;
let employees = [];
let receipts = [];
let loadState = "loading";   // loading · ok · error (F-09)
let loadError = "";
let tab = "reg";

// ── F-09 오류 문장: 우리말 이유 + 괄호 안에 짧은 원문 ──
function why(err, plain) {
  const raw = String((err && (err.message || err.error || err)) || "");
  if (!navigator.onLine || /Failed to fetch|NetworkError|Load failed/i.test(raw)) return "인터넷 연결을 확인해 주세요. (서버에 연결하지 못했습니다)";
  return plain + (raw ? ` (${raw.slice(0, 80)})` : "");
}
function setMsg(id, text, cls) { const m = $(id); m.textContent = text || ""; m.className = "msg" + (cls ? " " + cls : ""); }

// 일시는 서버가 준 글자를 그대로 잘라 보여 준다 — 시간대를 바꾸지 않는다
const showTime = (s) => (s ? String(s).replace("T", " ").slice(0, 16) : NO_DATE);
const monthOf = (r) => (r.used_at ? String(r.used_at).slice(0, 7) : NO_DATE);
const empOf = (no) => employees.find((e) => e.emp_no === no) || { name: no || "?", dept: "", title: "" };
const pad = (n) => String(n).padStart(2, "0");
function today() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }

// ── 탭 (R-01) ──
document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => { tab = b.dataset.tab; render(); });

// ── F-01 설정 읽기 ──
function init() {
  const cfg = window.APP_CONFIG || {};
  if (!cfg.SUPABASE_URL || !cfg.SUPABASE_KEY) return fatal("설정 파일(config.js)을 읽지 못했습니다.");
  if (!window.supabase || !window.supabase.createClient) return fatal("화면 부품(supabase-js)을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.");
  db = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
  $("f-date").value = today();
  syncFields();
  loadAll();
}
function fatal(text) {
  loadState = "error"; loadError = text;
  document.querySelectorAll("#reg-form input, #reg-form select, #reg-btn").forEach((el) => el.disabled = true);
  render();
}

// ── F-02 직원 목록 + F-06/F-07 영수증 불러오기 ──
async function loadAll() {
  loadState = "loading"; loadError = "";
  render();
  const [emp, rec] = await Promise.all([
    db.from("employee").select("emp_no, name, dept, title").order("emp_no"),
    db.from("receipt")
      .select("id, photo_path, emp_no, kind, used_at, store_name, total, card_last4, purpose, people, guest_company, memo, source, created_at")
      .order("used_at", { ascending: false, nullsFirst: false })
      .order("id", { ascending: false }),
  ]).catch((e) => [{ error: e }, { error: e }]);
  if (emp.error || rec.error) {
    loadState = "error";
    loadError = why(emp.error || rec.error, "데이터를 불러오지 못했습니다.");
    render();
    return;
  }
  employees = emp.data;
  receipts = rec.data;
  fillEmployees();
  fillMonths();
  loadState = "ok";
  render();
}

function fillEmployees() {
  const keepReg = $("f-emp").value, keepList = $("l-emp").value;
  $("f-emp").length = 1; $("l-emp").length = 1;
  employees.forEach((e) => {
    $("f-emp").add(new Option(`${e.name} (${e.dept} ${e.title})`, e.emp_no));
    $("l-emp").add(new Option(e.name, e.emp_no));
  });
  $("f-emp").value = keepReg; $("l-emp").value = keepList;
}

// 월 고르기: 영수증이 있는 달만, 최근 달부터. 처음엔 가장 최근 달 (R-06, F-06)
function fillMonths() {
  const months = [...new Set(receipts.map(monthOf))].sort((a, b) => (a === NO_DATE) - (b === NO_DATE) || b.localeCompare(a));
  ["l-month", "s-month"].forEach((id) => {
    const sel = $(id), keep = sel.value;
    sel.length = 0;
    months.forEach((m) => sel.add(new Option(m, m)));
    sel.value = months.includes(keep) ? keep : (months[0] || "");
  });
}

// ── F-03 입력 확인 (택시면 목적 · 인원 · 접대 상대 숨김 · 잠금) ──
function syncFields() {
  const taxi = $("f-kind").value === "택시";
  const guest = !taxi && $("f-purpose").value === "접대";
  $("r-purpose").classList.toggle("hidden", taxi);
  $("r-people").classList.toggle("hidden", taxi);
  $("r-guest").classList.toggle("hidden", !guest);
  $("f-purpose").disabled = taxi;
  $("f-people").disabled = taxi;
  $("f-guest").disabled = !guest;
}
$("f-kind").onchange = syncFields;
$("f-purpose").onchange = syncFields;

function checkInput() {
  const v = (id) => $(id).value.trim();
  const file = $("f-photo").files[0];
  const taxi = v("f-kind") === "택시";
  if (!v("f-emp")) return "제출자를 골라 주세요.";
  if (!file) return "영수증 사진을 골라 주세요.";
  if (!photoExt(file)) return "사진은 jpg · png · webp 파일만 올릴 수 있습니다.";
  if (file.size > MAX_PHOTO_BYTES) return "사진은 10MB 이하만 올릴 수 있습니다.";
  if (!v("f-kind")) return "구분을 골라 주세요.";
  if (!v("f-date")) return "날짜를 골라 주세요.";
  if (!/^([01]?\d|2[0-3]):[0-5]\d$/.test(v("f-time"))) return "시각은 12:20처럼 24시간 형식으로 적어 주세요.";
  if (!v("f-store")) return "가게 이름을 적어 주세요.";
  if (!/^[1-9]\d*$/.test(v("f-total").replace(/,/g, ""))) return "합계는 1 이상의 숫자(원)로 적어 주세요.";
  if (!taxi && !v("f-purpose")) return "목적을 골라 주세요.";
  if (!taxi && !/^[1-9]\d*$/.test(v("f-people"))) return "인원은 1 이상의 숫자로 적어 주세요.";
  if (!taxi && v("f-purpose") === "접대" && !v("f-guest")) return "접대 상대를 적어 주세요.";
  return "";
}

// ── F-04 사진 올리기: web_날짜_시각_임의4자리.확장자 ──
function photoExt(file) {
  if (PHOTO_TYPES[file.type]) return PHOTO_TYPES[file.type];
  const m = /\.(jpe?g|png|webp)$/i.exec(file.name || "");
  return m ? (m[1].toLowerCase() === "jpeg" ? "jpg" : m[1].toLowerCase()) : "";
}
function photoName(ext) {
  const d = new Date(), chars = "abcdefghijklmnopqrstuvwxyz0123456789";
  const rnd = Array.from(crypto.getRandomValues(new Uint8Array(4)), (b) => chars[b % chars.length]).join("");
  return `web_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}_${rnd}.${ext}`;
}
async function uploadPhoto(file) {
  const ext = photoExt(file);
  const type = Object.keys(PHOTO_TYPES).find((t) => PHOTO_TYPES[t] === ext);
  for (let attempt = 0; attempt < 2; attempt++) {
    const name = photoName(ext);
    const { error } = await db.storage.from(BUCKET).upload(name, file, { contentType: type, upsert: false });
    if (!error) return { name };
    const dup = String(error.statusCode) === "409" || /exist|duplicate/i.test(error.message || "");
    if (!dup || attempt === 1) return { error };
  }
}

// ── F-05 영수증 등록 ──
function lockForm(locked) {
  document.querySelectorAll("#reg-form input, #reg-form select").forEach((el) => el.disabled = locked);
  $("reg-btn").disabled = locked;
  $("reg-btn").textContent = locked ? "등록 중…" : "등록";
  if (!locked) syncFields();
}
$("reg-btn").onclick = async () => {
  const err = checkInput();
  if (err) { setMsg("reg-msg", err, "err"); return; }
  const v = (id) => $(id).value.trim();
  const taxi = v("f-kind") === "택시";
  const [hh, mm] = v("f-time").split(":");
  const row = {
    emp_no: v("f-emp"),
    kind: v("f-kind"),
    used_at: `${v("f-date")}T${pad(hh)}:${mm}:00`,
    store_name: v("f-store"),
    total: parseInt(v("f-total").replace(/,/g, ""), 10),
    purpose: taxi ? null : v("f-purpose"),
    people: taxi ? null : parseInt(v("f-people"), 10),
    guest_company: !taxi && v("f-purpose") === "접대" ? v("f-guest") : null,
    memo: v("f-memo") || null,
    source: "웹",
  };
  lockForm(true);
  setMsg("reg-msg", "등록 중…");
  const up = await uploadPhoto($("f-photo").files[0]).catch((e) => ({ error: e }));
  if (up.error) {
    lockForm(false);
    setMsg("reg-msg", why(up.error, "사진을 올리지 못했습니다."), "err");
    return;
  }
  row.photo_path = up.name;
  const { error } = await db.from("receipt").insert(row).then((r) => r, (e) => ({ error: e }));
  lockForm(false);
  if (error) {
    setMsg("reg-msg", why(error, `사진은 올라갔지만 영수증 저장에 실패했습니다. 정산 담당에게 알려 주세요. (사진 이름: ${up.name})`), "err");
    return;
  }
  $("reg-form").reset();
  $("f-date").value = today();
  syncFields();
  setMsg("reg-msg", "등록했습니다.", "ok");
  loadAll();
};

// ── F-06 목록과 고르기 ──
["l-month", "l-emp", "l-kind"].forEach((id) => $(id).onchange = render);

function renderList() {
  const box = $("list-box"), summary = $("list-summary");
  box.classList.add("hidden");
  summary.classList.add("hidden");
  if (loadState === "loading") return setMsg("list-msg", "불러오는 중…");
  if (loadState === "error") return setMsg("list-msg", loadError, "err");
  const rows = receipts
    .filter((r) => monthOf(r) === $("l-month").value)
    .filter((r) => !$("l-emp").value || r.emp_no === $("l-emp").value)
    .filter((r) => !$("l-kind").value || r.kind === $("l-kind").value);
  // F-12 목록 요약 줄: 지금 고른 조건의 건수 · 합계
  summary.textContent = `${rows.length}건 · ${won(rows.reduce((s, r) => s + (r.total || 0), 0))}원`;
  summary.classList.remove("hidden");
  if (!rows.length) return setMsg("list-msg", "이 조건에 맞는 영수증이 없습니다.");
  setMsg("list-msg", "");
  box.classList.remove("hidden");
  $("list-body").innerHTML = "";
  rows.forEach((r) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${esc(showTime(r.used_at))}</td><td>${esc(empOf(r.emp_no).name)}</td><td>${dash(r.kind)}</td>` +
      `<td>${dash(r.store_name)}</td><td class="num">${won(r.total)}</td><td>${esc(r.source)}</td>`;
    tr.onclick = () => openDetail(r);
    $("list-body").appendChild(tr);
  });
}

// ── F-07 집계 ──
$("s-month").onchange = render;

function group(rows, keyFn, order) {
  const m = new Map((order || []).map((k) => [k, { n: 0, sum: 0 }]));
  rows.forEach((r) => {
    const k = keyFn(r), g = m.get(k) || { n: 0, sum: 0 };
    g.n++; g.sum += r.total || 0; m.set(k, g);
  });
  return [...m.entries()];
}
function table(title, entries) {
  return `<h3>${title}</h3><div class="tablebox"><table><thead><tr><th></th><th class="num">건수</th><th class="num">금액(원)</th></tr></thead><tbody>` +
    entries.map(([k, g]) => `<tr><td>${esc(k)}</td><td class="num">${g.n}</td><td class="num">${won(g.sum)}</td></tr>`).join("") +
    `</tbody></table></div>`;
}
function renderSum() {
  const box = $("sum-box");
  box.innerHTML = "";
  if (loadState === "loading") return setMsg("sum-msg", "불러오는 중…");
  if (loadState === "error") return setMsg("sum-msg", loadError, "err");
  const rows = receipts.filter((r) => monthOf(r) === $("s-month").value);
  if (!rows.length) return setMsg("sum-msg", "이 달에 등록된 영수증이 없습니다.");
  setMsg("sum-msg", "");
  // 식사 1인당 = 그 달 식사 영수증 합계 ÷ 식사 영수증 인원 합계, 원 단위 반올림 (인원이 빈 식사 영수증은 뺀다)
  const meal = rows.filter((r) => r.kind === "식사" && r.people > 0);
  const mealSum = meal.reduce((s, r) => s + (r.total || 0), 0);
  const mealPeople = meal.reduce((s, r) => s + r.people, 0);
  const perHead = mealPeople ? `<b>${won(Math.round(mealSum / mealPeople))}원</b> <span class="hint">(식사 합계 ${won(mealSum)}원 ÷ 식사 인원 ${mealPeople}명)</span>` : "<b>식사 없음</b>";
  const byEmp = group(rows, (r) => r.emp_no).sort((a, b) => b[1].sum - a[1].sum)
    .map(([no, g]) => [`${empOf(no).name} (${empOf(no).dept})`, g]);
  box.innerHTML =
    `<p class="big">건수 <b>${rows.length}건</b> · 합계 <b>${won(rows.reduce((s, r) => s + (r.total || 0), 0))}원</b></p>` +
    `<p class="big">식사 1인당 ${perHead}</p>` +
    table("구분별 합계", group(rows, (r) => r.kind || "구분 없음", ["식사", "카페", "택시"])) +
    table("목적별 합계", group(rows, (r) => r.purpose || "목적 없음", ["일반", "회식", "접대", "목적 없음"])) +
    table("직원별 합계 (금액 많은 순)", byEmp);
}

// ── F-08 상세와 사진 임시 주소 ──
let current = null, detailToken = 0;
async function openDetail(r) {
  current = r;
  const token = ++detailToken;
  $("detail").classList.remove("hidden");
  setMsg("d-msg", "불러오는 중…");
  $("d-body").innerHTML = "";
  const [items, photo] = await Promise.all([
    db.from("receipt_item").select("id, item_name, qty, unit_price, amount").eq("receipt_id", r.id).order("id").then((x) => x, (e) => ({ error: e })),
    db.storage.from(BUCKET).createSignedUrl(r.photo_path, SIGNED_URL_SECONDS).then((x) => x, (e) => ({ error: e })),
  ]);
  if (token !== detailToken) return;   // 그사이 다른 줄을 열었으면 버린다
  setMsg("d-msg", items.error ? why(items.error, "품목을 불러오지 못했습니다.") : "", items.error ? "err" : "");
  renderDetail(r, items.error ? null : items.data, photo.error ? null : photo.data.signedUrl);
}
function closeDetail() { current = null; detailToken++; $("detail").classList.add("hidden"); }
$("d-close").onclick = closeDetail;
$("detail").onclick = (e) => { if (e.target.id === "detail") closeDetail(); };

function renderDetail(r, items, photoUrl) {
  const e = empOf(r.emp_no);
  const photo = photoUrl
    ? `<div class="photo"><img src="${esc(photoUrl)}" alt="영수증 사진" onerror="this.parentNode.textContent='사진을 열지 못했습니다. 잠시 뒤 다시 열어 주세요.'"></div>`
    : `<div class="photo">사진을 열지 못했습니다. 잠시 뒤 다시 열어 주세요.</div>`;
  let itemHtml = "";
  if (items && !items.length) itemHtml = `<p>품목 없음</p>`;
  else if (items) {
    const s = items.reduce((a, i) => a + (i.amount || 0), 0);
    const check = s === r.total ? "일치" : `불일치 (차이 ${won((r.total || 0) - s)}원)`;
    itemHtml = `<div class="tablebox"><table><thead><tr><th>품목</th><th class="num">수량</th><th class="num">단가</th><th class="num">금액</th></tr></thead><tbody>` +
      items.map((i) => `<tr><td>${esc(i.item_name)}</td><td class="num">${won(i.qty)}</td><td class="num">${won(i.unit_price)}</td><td class="num">${won(i.amount)}</td></tr>`).join("") +
      `</tbody></table></div><p>품목 합 ${won(s)} = 합계 ${won(r.total)} · <b>${check}</b></p>`;
  }
  $("d-body").innerHTML = photo +
    `<dl><dt>구분</dt><dd>${dash(r.kind)}</dd><dt>일시</dt><dd>${esc(showTime(r.used_at))}</dd><dt>가게</dt><dd>${dash(r.store_name)}</dd>` +
    `<dt>합계</dt><dd>${r.total == null ? "-" : won(r.total) + "원"}</dd><dt>제출자</dt><dd>${esc(e.name)} (${esc(e.dept)})</dd>` +
    `<dt>목적</dt><dd>${dash(r.purpose)}</dd><dt>인원</dt><dd>${dash(r.people)}</dd><dt>접대 상대</dt><dd>${dash(r.guest_company)}</dd>` +
    `<dt>카드 끝</dt><dd>${dash(r.card_last4)}</dd><dt>등록 방식</dt><dd>${esc(r.source)}</dd><dt>메모</dt><dd>${dash(r.memo)}</dd></dl>` + itemHtml;
}

// ── F-09 상태 표시 (등록 화면) ──
function renderReg() {
  if ($("reg-btn").textContent === "등록 중…") return;      // 저장 중에는 그대로 둔다
  const ready = loadState === "ok";
  $("reg-btn").disabled = !ready;
  const m = $("reg-msg");
  if (loadState === "loading" && !m.textContent) setMsg("reg-msg", "불러오는 중…");
  if (loadState === "ok" && m.textContent === "불러오는 중…") setMsg("reg-msg", "");
  if (loadState === "error") setMsg("reg-msg", loadError, "err");
}

function render() {
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  ["reg", "list", "sum"].forEach((t) => $("tab-" + t).classList.toggle("hidden", t !== tab));
  const locked = loadState !== "ok";
  ["l-month", "l-emp", "l-kind", "s-month"].forEach((id) => $(id).disabled = locked);
  renderReg();
  renderList();
  renderSum();
}

init();
</script>
